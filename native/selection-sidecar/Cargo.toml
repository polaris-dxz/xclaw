[package]
name = "selection-sidecar"
version = "0.1.0"
edition = "2021"
description = "Cross-platform helper: system selection events → NDJSON over loopback TCP"
license = "MIT"

[[bin]]
name = "selection-sidecar"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
